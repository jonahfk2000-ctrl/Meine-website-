<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Grundeinstellungen der Seite -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jonah Köppe</title>

  <!-- Hier wird die Design-Datei eingebunden -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Kopfbereich mit Name und Navigation ===== -->
  <header>
    <nav>
      <a href="#" class="logo">Jonah Köppe</a>
      <ul>
        <li><a href="#ueber-mich">Über mich</a></li>
        <li><a href="#hobbys">Meine Hobbys</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- ===== Bereich 1: Über mich ===== -->
    <section id="ueber-mich">
      <h1>Hallo, ich bin Jonah Köppe</h1>
      <h2>Über mich</h2>
      <p>Moritz stinkt</p>
    </section>

    <!-- ===== Bereich 2: Meine Hobbys ===== -->
    <!-- Ersetze die Platzhalter durch deine eigenen Hobbys.
         Für ein weiteres Hobby kopierst du einfach eine <li>-Zeile. -->
    <section id="hobbys">
      <h2>Meine Hobbys</h2>
      <ul class="hobby-liste">
        <li>Hobby 1</li>
        <li>Hobby 2</li>
        <li>Hobby 3</li>
      </ul>
    </section>

    <!-- ===== Bereich 3: Kontakt ===== -->
    <!-- Trage hier deine E-Mail-Adresse ein (an beiden Stellen). -->
    <section id="kontakt">
      <h2>Kontakt</h2>
      <p>Du möchtest mir schreiben? Dann schick mir eine E-Mail:</p>
      <p><a href="mailto:deine-email@beispiel.de">deine-email@beispiel.de</a></p>
    </section>

  </main>

  <!-- ===== Fußzeile ===== -->
  <footer>
    <p>&copy; 2026 Jonah Köppe</p>
  </footer>

</body>
</html>
